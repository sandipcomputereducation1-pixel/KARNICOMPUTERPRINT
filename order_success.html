<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:Arial;background:#eff6ff;padding:25px}.card{max-width:500px;margin:40px auto;background:white;padding:28px;border-radius:15px;text-align:center}</style>
<div class="card"><h1>ऑर्डर सफलतापूर्वक भेज दिया गया!</h1><h2>{{code}}</h2><p>अनुमानित राशि: ₹{{amount}}</p><p>भुगतान तरीका: {{payment_mode}}</p>{% if payment_mode=="UPI" %}<p>UPI ID: <b>{{upi}}</b></p>{% endif %}<p>दुकान पर ऑर्डर नंबर बताएं। भुगतान और प्रिंट की पुष्टि दुकान से होगी।</p><b>{{shop}}</b></div></html>
